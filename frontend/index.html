<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HushDrop — Твои файлы. Твоя сеть. Никого лишнего.</title>
    <meta name="description" content="Приватная передача файлов телефон<->ПК без мессенджеров и облака в локальной сети" />
    <meta name="theme-color" content="#090d16" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #0b0f19;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        opacity: 1;
        transition: opacity 300ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      #boot-splash.done {
        opacity: 0;
        pointer-events: none;
      }

      .boot-logo-wrapper {
        position: relative;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-svg {
        width: 100px;
        height: 100px;
        display: block;
      }

      .splash-circle-draw {
        stroke-dasharray: 240;
        stroke-dashoffset: 240;
        opacity: 0;
        animation: splashCircleDraw 0.85s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }

      @keyframes splashCircleDraw {
        0% { stroke-dashoffset: 240; opacity: 0.2; }
        20% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.85; }
      }

      .splash-arrow-group {
        transform-origin: 50px 43px;
        opacity: 0;
        animation: splashArrowFall 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
      }

      @keyframes splashArrowFall {
        0% { transform: translateY(-26px); opacity: 0; }
        40% { opacity: 1; }
        85% { transform: translateY(2px); }
        100% { transform: translateY(0); opacity: 1; }
      }

      .splash-arrow {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: splashArrowDraw 0.55s ease-out 0.45s forwards;
      }

      @keyframes splashArrowDraw {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      .splash-baseline {
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
        opacity: 0;
        animation: splashLineDraw 0.35s cubic-bezier(0.4, 0, 0.2, 1) 0.95s forwards;
      }

      @keyframes splashLineDraw {
        0% { stroke-dashoffset: 40; opacity: 0; }
        25% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }

      .splash-symbol {
        animation: splashShimmer 0.35s ease-in-out 1.3s 1 normal forwards,
                   splashIdlePulse 2.2s ease-in-out 1.7s infinite alternate;
      }

      @keyframes splashShimmer {
        0% { filter: drop-shadow(0 0 0 rgba(16, 185, 129, 0)) brightness(1); }
        50% { filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.95)) drop-shadow(0 0 4px #34d399) brightness(1.4); }
        100% { filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.25)) brightness(1); }
      }

      @keyframes splashIdlePulse {
        0% { transform: translateY(0); filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.25)); }
        100% { transform: translateY(-2px); filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.5)); }
      }

      .boot-caption {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
        animation: bootCaptionFade 0.5s ease-out 0.8s forwards;
      }

      @keyframes bootCaptionFade {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .boot-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f8fafc;
      }

      .boot-sub {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        color: #64748b;
        margin-top: 3px;
        font-weight: 500;
      }

      .boot-progress {
        width: 140px;
        height: 3px;
        background: #1e293b;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 18px;
        opacity: 0;
        animation: bootShowProgress 0.4s ease 3s forwards;
      }

      @keyframes bootShowProgress {
        to { opacity: 1; }
      }

      .boot-progress-bar {
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, #10b981, #34d399, #10b981);
        border-radius: 999px;
        animation: bootIndeterminate 1.4s ease-in-out infinite;
      }

      @keyframes bootIndeterminate {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(120%); }
        100% { transform: translateX(320%); }
      }

      .boot-error {
        margin-top: 18px;
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: bootErrorFade 0.3s ease forwards;
      }

      @keyframes bootErrorFade {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .boot-error-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        color: #f87171;
        margin-bottom: 10px;
      }

      .boot-reload-btn {
        background: #1e293b;
        color: #e2e8f0;
        border: 1px solid #334155;
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .boot-reload-btn:hover {
        background: #334155;
        color: #fff;
        border-color: #10b981;
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-circle-draw,
        .splash-arrow-group,
        .splash-arrow,
        .splash-baseline,
        .splash-symbol,
        .boot-caption,
        .boot-progress,
        .boot-progress-bar {
          animation: none !important;
          transition: none !important;
          transform: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
          filter: none !important;
        }
        .boot-progress {
          display: none !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-logo-wrapper">
        <svg class="splash-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" aria-label="HushDrop">
          <defs>
            <linearGradient id="splash-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#10b981" />
              <stop offset="100%" stop-color="#065f46" />
            </linearGradient>
          </defs>
          <rect width="100" height="100" rx="24" fill="#0b0f19" />
          <circle cx="50" cy="50" r="38" fill="none" stroke="#1e293b" stroke-width="2" />
          <circle class="splash-circle-draw" cx="50" cy="50" r="38" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
          <g class="splash-symbol">
            <g class="splash-arrow-group">
              <path class="splash-arrow" d="M50 24 L50 62 M34 46 L50 62 L66 46" stroke="url(#splash-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            </g>
            <path class="splash-baseline" d="M30 74 L70 74" stroke="#10b981" stroke-width="7" stroke-linecap="round" />
          </g>
        </svg>
      </div>
      <div class="boot-caption">
        <span class="boot-title">HushDrop</span>
        <span class="boot-sub">Твои файлы. Твоя сеть.</span>
      </div>
      <div class="boot-progress" id="boot-progress" aria-hidden="true">
        <div class="boot-progress-bar"></div>
      </div>
      <div class="boot-error" id="boot-error" style="display: none;" role="alert">
        <p class="boot-error-text">Загрузка занимает слишком много времени</p>
        <button type="button" class="boot-reload-btn" onclick="window.location.reload()">Перезагрузить</button>
      </div>
    </div>
    <script>
      (function() {
        window.__hushdropBootStart = (window.performance && performance.now) ? performance.now() : Date.now();
        var timer = setTimeout(function() {
          var splash = document.getElementById('boot-splash');
          if (splash && !splash.classList.contains('done')) {
            var err = document.getElementById('boot-error');
            var prog = document.getElementById('boot-progress');
            if (err) err.style.display = 'flex';
            if (prog) prog.style.display = 'none';
          }
        }, 8000);
        window.__hushdropBootTimer = timer;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
