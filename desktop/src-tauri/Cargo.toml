[package]
name = "hushdrop-desktop"
version = "0.3.1"
description = "HushDrop Desktop Tauri 2 Portable Wrapper"
authors = ["HushDrop Team"]
license = "MIT"
repository = "https://github.com/remageht/HushDrop"
edition = "2021"

[lib]
name = "hushdrop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
percent-encoding = "2"
