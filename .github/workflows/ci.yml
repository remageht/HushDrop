name: CI

on:
  push:
    branches:
      - main
      - public-lite
  pull_request:
    branches:
      - main
      - public-lite

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Frontend Dependencies & Build React PWA
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Synchronize Embedded Web Assets
        shell: bash
        run: |
          mkdir -p internal/server/web
          cp -r frontend/dist/* internal/server/web/

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Unit & Integration Tests
        run: go test -v ./...

      - name: Compile HushDrop Binary
        run: go build -ldflags="-s -w" -o HushDrop ./cmd/hushdrop

  desktop:
    name: Build Desktop (Tauri 2)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Frontend & Sidecar Go Binary
        shell: bash
        run: |
          cd frontend && npm ci && npm run build && cd ..
          mkdir -p internal/server/web
          cp -r frontend/dist/* internal/server/web/
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/HushDrop.exe ./cmd/hushdrop

      - name: Check Desktop Tauri Compilation
        run: |
          cd desktop
          npm ci
          cd src-tauri
          cargo check
