name: CI

on:
  push:
    branches:
      - main
      - public-lite
  pull_request:
    branches:
      - main
      - public-lite

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Frontend Dependencies & Build React PWA
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Synchronize Embedded Web Assets
        shell: bash
        run: |
          mkdir -p internal/server/web
          cp -r frontend/dist/* internal/server/web/

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Unit & Integration Tests
        run: go test -v ./...

      - name: Compile HushDrop Binary
        run: go build -ldflags="-s -w" -o HushDrop ./cmd/hushdrop

  desktop:
    name: Build Desktop (Tauri 2)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Frontend & Sidecar Go Binary
        shell: bash
        run: |
          cd frontend && npm ci && npm run build && cd ..
          mkdir -p internal/server/web
          cp -r frontend/dist/* internal/server/web/
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/HushDrop.exe ./cmd/hushdrop

      - name: Check Desktop Tauri Compilation
        run: |
          cd desktop
          npm ci
          cd src-tauri
          cargo check

  android-custom-idempotence:
    name: Verify Android Customization Script Idempotence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Add Android Platform via Capacitor
        run: |
          cd mobile
          npx cap add android

      - name: First Run of Customization Script
        run: |
          chmod +x mobile/scripts/apply-android-custom.sh
          ./mobile/scripts/apply-android-custom.sh

      - name: Snapshot Modified Files
        run: |
          sha256sum mobile/android/app/src/main/AndroidManifest.xml > /tmp/manifest.sha
          sha256sum mobile/android/app/build.gradle > /tmp/gradle.sha
          sha256sum mobile/android/settings.gradle > /tmp/settings.sha
          sha256sum mobile/android/app/src/main/java/app/hushdrop/MainActivity.java > /tmp/activity.sha
          sha256sum mobile/android/app/src/main/res/xml/network_security_config.xml > /tmp/netsec.sha

      - name: Second Run of Customization Script (Idempotency Check)
        run: |
          ./mobile/scripts/apply-android-custom.sh

      - name: Verify All File Hashes Remain Identical
        run: |
          sha256sum -c /tmp/manifest.sha
          sha256sum -c /tmp/gradle.sha
          sha256sum -c /tmp/settings.sha
          sha256sum -c /tmp/activity.sha
          sha256sum -c /tmp/netsec.sha

